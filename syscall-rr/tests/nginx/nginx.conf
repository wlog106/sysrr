# nginx config for tests/test_nginx.sh: a master and 2 worker processes.
# The access log line carries values that only a faithful replay gets right:
#   $request_id  32 hex digits from nginx's PRNG state (memory, not syscalls)
#   $msec        the clock (recorded clock_gettime / gettimeofday)
#   $pid         which worker served the request (the order across processes)
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    log_format t '$remote_addr "$request" $status $body_bytes_sent '
                 'id=$request_id t=$msec pid=$pid conn=$connection/$connection_requests';
    access_log /dev/stdout t;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 80 reuseport;    # one listening socket per worker: the kernel spreads connections
        root /usr/share/nginx/html;
        location /id {
            default_type text/plain;
            return 200 "id=$request_id t=$msec pid=$pid\n";
        }
    }
}
